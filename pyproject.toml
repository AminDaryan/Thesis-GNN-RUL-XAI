[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-gnn-rul-xai"
version = "0.1.0"
description = "Explainable Graph Neural Networks for Remaining Useful Life prediction on NASA C-MAPSS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amin Darian" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.25", "seaborn>=0.13"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "nbconvert>=7.9", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"
pythonpath = ["src"]

# Preprocessing settings for the C-MAPSS FD001 sub-dataset.
#
# Every field is documented in src/thesis_gnn_rul_xai/config.py.
# Fields whose value is NOT taken from Wen et al. (2026) are marked below and
# explained in docs/ASSUMPTIONS.md.

subset: FD001

# --- Windowing ------------------------------------------------------------
window_size: 30        # From the paper, Table 6 ("Time steps").
window_stride: 1       # ASSUMPTION A-05: not stated in the paper.

# --- Labels ---------------------------------------------------------------
rul_max: 125           # ASSUMPTION A-01: the paper never prints this value.
clip_test_labels: true # ASSUMPTION A-02: forced by the sigmoid output layer.

# --- Signal processing ----------------------------------------------------
normalization: zscore                # ASSUMPTION A-03: the paper is silent.
                                     # Selected under the rule in A-22; worth
                                     # 3.83 cycles against min-max (F-10).
smoothing_alpha: 0.5                 # ASSUMPTION A-04: the paper is ambiguous.

# --- The sensor graph -----------------------------------------------------
# ASSUMPTION A-21: the paper never prints the normalisation formula. With
# nothing held back -- which was the default until 2026-09-02, but is not
# what this file now sets -- row is 0.35 cycles closer than symmetric over
# five seeds (paired p = 0.047, two-sided). That advantage does NOT survive
# holding engines out -- see A-21's table before quoting it more widely.
adjacency_normalization: row

# --- Data splitting -------------------------------------------------------
# ASSUMPTION A-06. Hold back 20 % of the training engines, chosen by engine and
# never by window, because neighbouring windows of one engine overlap almost
# completely. The paper describes no held-out set: Table 6 states 200 epochs
# with no early stopping. So holding engines out, restoring the weights that
# scored best on them, and stopping early are all additions -- and a number
# from this file therefore cannot be set beside a published one without saying
# so. Reinstated 2026-09-08, reversing the 2026-08-29 removal; see A-06.
validation_fraction: 0.2
seed: 42

notes: >-
  Preprocessing configuration for the FD001 subset. Fields marked ASSUMPTION
  are not specified by Wen et al. (2026); see docs/ASSUMPTIONS.md.
